# Railway MySQL public endpoint (used to run the app locally while pointing
# at the Railway-hosted database, so tables are created there via
# spring.jpa.hibernate.ddl-auto=update). Replace the placeholders below with
# the public host/port/password shown on the MySQL service's "Connect" tab
# in the Railway dashboard (Public Networking section).
spring.datasource.url=jdbc:mysql://${MYSQL_PUBLIC_HOST:<RAILWAY_MYSQL_PUBLIC_HOST>}:${MYSQL_PUBLIC_PORT:3306}/${MYSQLDATABASE:railway}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQL_PUBLIC_PASSWORD:<RAILWAY_MYSQL_PASSWORD>}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

